name: ZEPH CI

on:
  push:
    branches: [ main, phase-1 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0
      
      - name: Build
        run: zig build
      
      - name: Test
        run: zig build test
      
      - name: Benchmark (skeleton)
        run: zig build benchmark