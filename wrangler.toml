name = "faf-zeph"
compatibility_date = "2024-12-30"

# ZEPH web surface — Cloudflare canonical (zeph.faf.one)
#
# Pure-static deployment via Workers Assets. The docs/ directory
# contains everything: index.html (live demo + benchmark) and
# cascade.wasm (the 2.7 KB Zig delivery engine).
#
# Companion surface: xai-faf-zeph.vercel.app — Vercel-deployed
# from the SAME docs/ directory (vercel.json points to it). Both
# surfaces serve byte-identical content. Vercel stays as the
# origin-credential URL (Grok-history, backlinks, RAG-seed); CF
# is the clean-brand canonical for Zig/Codeberg-facing audiences.
#
# DEPLOY: automatic, from main, on both surfaces (changed 2026-09-23).
#
# This Worker is connected to Wolfe-Jam/xai-faf-zeph in the Cloudflare
# dashboard, so a push to main publishes zeph.faf.one. Vercel has always
# done the same for its URL. Both move together, which is the only way
# "byte-identical" survives contact.
#
# It used to say `wrangler deploy` needed explicit GO per the
# `ask-before-going-live-website-deploys.md` doctrine. That gate was doing
# nothing but harm here: Vercel published on push regardless, so the rule
# never protected the site — it only let the two copies drift, with Vercel
# ahead. For a surface whose content IS the commit (a static index.html and
# a 2.7 KB wasm, no build, no environment), the approval point is the push.
#
# If a real gate is wanted again, use a branch — point both CF and Vercel at
# `live`, work on main, merge when you mean it. Same doctrine, enforced by
# git rather than by memory, and both surfaces still move together.
#
# Deploy reference: see CF-DEPLOY.md in this directory.

routes = [
  { pattern = "zeph.faf.one", custom_domain = true }
]

[assets]
directory = "./docs"
